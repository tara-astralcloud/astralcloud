# ingress-nginx 4.10.1 — LoadBalancer via MetalLB, single replica
# Official images are multi-arch (linux/arm64 included) since v1.9.x.

controller:
  service:
    type: LoadBalancer

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  replicaCount: 1

  hostPort:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  config:
    use-forwarded-headers: "true"
    proxy-body-size: "50m"
